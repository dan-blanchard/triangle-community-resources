name: Daily rebuild

on:
  schedule:
    - cron: "15 10 * * *"   # 10:15 UTC = 6:15am EDT / 5:15am EST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "sources/**", "templates/**", "data/curated/**", "data/*.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Last good copy of each source, used if a source is unreachable today.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-

      - name: Scrape, check links, render
        run: uv run build.py

      - name: Save history (first-seen dates, link-failure streaks, geocode cache)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/geocache.json
          git diff --cached --quiet || git commit -m "Daily rebuild $(date -u +%F)" && git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
