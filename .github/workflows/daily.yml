name: Daily rebuild

on:
  schedule:
    - cron: "15 10 * * *"   # 10:15 UTC = 6:15am EDT / 5:15am EST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "sources/**", "templates/**", "data/curated/**", "data/*.json", ".github/workflows/**"]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: daily-rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Last good copy of each source, used if a source is unreachable today.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: source-cache-${{ github.run_id }}
          restore-keys: source-cache-

      - name: Scrape, check links, render
        run: uv run build.py

      # One open "build-review" issue lists what needs a person's judgment (build_review.md).
      # Opened when something turns up, updated with a comment when the list changes, closed when clear.
      - name: Open, update or close the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create build-review --color FBCA04 --description "Daily build found something to review" --force >/dev/null
          num=$(gh issue list --label build-review --state open --json number --jq '.[0].number // empty')
          if [ -s build_review.md ]; then
            new=$(grep -o 'review-hash: [0-9a-f]*' build_review.md || true)
            if [ -z "$num" ]; then
              gh issue create --title "Daily build: needs review" --label build-review --body-file build_review.md
            else
              old=$(gh issue view "$num" --json body --jq .body | grep -o 'review-hash: [0-9a-f]*' || true)
              if [ "$new" != "$old" ]; then
                gh issue edit "$num" --body-file build_review.md
                gh issue comment "$num" --body "The list changed in the $(date -u +%F) build; see the updated description."
              fi
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Nothing to review as of the $(date -u +%F) build."
          fi

      - name: Save history (first-seen dates, link-failure streaks, geocode + logo caches)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/geocache.json data/logos.json data/logos
          git diff --cached --quiet || git commit -m "Daily rebuild $(date -u +%F)" && git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
